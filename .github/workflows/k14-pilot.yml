# No checkout, package fetch, credentials, model calls, publishers or enabled job remain.
name: k14-pilot-retired
'on':
  issues:
    types:
    - labeled
permissions: {}
jobs:
  retired:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
    - name: Exact runner guard (unreachable while hard OFF)
      shell: bash
      run: 'set -euo pipefail

        test "${ImageOS:-}" = ubuntu24

        test "${ImageVersion:-}" = 20261004.327.1

        test "$(uname -m)" = x86_64

        test "$(/usr/bin/python3 --version)" = ''Python 3.12.3''

        echo ''Admitted exact runner image 20261004.327.1; changed images stop before
        checkout.''

        '
    - run: echo "Legacy seed-1 pilot retired. Replacement remains an owner-gated inactive
        proposal."
